name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          
          # Draai alle tests met hun eigen resultatenbestand
          make COCOTB_RESULTS_FILE=results_tb.xml
          make test_balance COCOTB_RESULTS_FILE=results_balance.xml
          make test_chest COCOTB_RESULTS_FILE=results_chest.xml
          make test_lfsr COCOTB_RESULTS_FILE=results_lfsr.xml
          
          # Controleer op errors in ALLE xml-bestanden tegelijk
          ! grep '<failure' results_*.xml

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "test/results_*.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results_*.xml
            test/output/*
